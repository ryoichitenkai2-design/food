name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: LazyBulk-iOS
    steps:
      - uses: actions/checkout@v5
      - name: Add app icon
        run: |
          D=LazyBulk/Assets.xcassets/AppIcon.appiconset
          mkdir -p $D
          cp ../icon.png $D/icon-1024.png
          echo '{"info":{"author":"xcode","version":1}}' > LazyBulk/Assets.xcassets/Contents.json
          echo '{"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > $D/Contents.json
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project LazyBulk.xcodeproj -scheme LazyBulk -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log
      - name: Package IPA
        run: |
          APP=$(find build -name "LazyBulk.app" -path "*Release-iphoneos*" | head -n 1)
          echo "Found: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr LazyBulk.ipa Payload
      - name: Show errors
        if: failure()
        run: grep -E "error:|BUILD FAILED" build.log | head -n 40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            LazyBulk-iOS/LazyBulk.ipa
            LazyBulk-iOS/build.log
          if-no-files-found: ignore
