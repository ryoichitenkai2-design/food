name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Show repo layout
        run: |
          ls -la
          ls -la LazyBulk
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project LazyBulk.xcodeproj -scheme LazyBulk -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log
      - name: Package IPA
        run: |
          APP=$(find build -name "LazyBulk.app" -path "*Release-iphoneos*" | head -n 1)
          echo "Found: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr LazyBulk.ipa Payload
      - name: Show errors
        if: failure()
        run: grep -E "error:|BUILD FAILED" build.log | head -n 40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            LazyBulk.ipa
            build.log
          if-no-files-found: ignore
