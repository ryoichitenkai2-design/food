name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - name: Locate project
        run: |
          PF=$(find . -name project.yml -not -path "./.git/*" | head -n 1)
          echo "project.yml at: $PF"
          echo "PROJ=$(dirname "$PF")" >> $GITHUB_ENV
          find . -not -path "./.git/*" -type f | head -n 40

      - name: Add app icon
        run: |
          ICON=$(find "$GITHUB_WORKSPACE" -iname "icon*.png" -not -path "*/.git/*" -not -path "*xcassets*" | head -n 1)
          echo "Icon found: $ICON"
          if [ -n "$ICON" ]; then
            D="$PROJ/LazyBulk/Assets.xcassets/AppIcon.appiconset"
            mkdir -p "$D"
            cp "$ICON" "$D/icon-1024.png"
            echo '{"info":{"author":"xcode","version":1}}' > "$PROJ/LazyBulk/Assets.xcassets/Contents.json"
            echo '{"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$D/Contents.json"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cd "$PROJ"
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          cd "$PROJ"
          xcodebuild -project LazyBulk.xcodeproj -scheme LazyBulk -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package IPA
        run: |
          cd "$PROJ"
          APP=$(find build -name "LazyBulk.app" -path "*Release-iphoneos*" | head -n 1)
          echo "Found: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr "$GITHUB_WORKSPACE/LazyBulk.ipa" Payload

      - name: Show errors
        if: failure()
        run: grep -E "error:|BUILD FAILED" "$GITHUB_WORKSPACE/build.log" | head -n 40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            LazyBulk.ipa
            build.log
          if-no-files-found: ignore
